<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#f8f9fa"/>
  
  <!-- Modal Overlay -->
  <rect x="0" y="0" width="1920" height="1080" fill="#000000" opacity="0.3"/>
  
  <!-- Modal Box -->
  <rect x="320" y="247" width="1280" height="586" fill="white" stroke="#28a745" stroke-width="3" rx="10"/>
  
  <!-- Modal Title -->
  <text x="960" y="386" font-family="Arial, sans-serif" font-size="74" font-weight="bold" text-anchor="middle" fill="#28a745">出勤打刻完了</text>
  
  <!-- Success Icon -->
  <circle cx="960" cy="524" r="91" fill="#28a745" fill-opacity="0.2" stroke="#28a745" stroke-width="2"/>
  <text x="960" y="555" font-family="Arial, sans-serif" font-size="110" text-anchor="middle" fill="#28a745">✓</text>
  
  <!-- Message -->
  <text x="960" y="663" font-family="Arial, sans-serif" font-size="51" text-anchor="middle" fill="#333">出勤時刻を記録しました</text>
  
  <!-- Time Display -->
  <text x="960" y="734" font-family="Arial, sans-serif" font-size="59" font-weight="bold" text-anchor="middle" fill="#28a745">09:00:00</text>
  
  <!-- Close Button -->
  <rect x="800" y="787" width="320" height="108" fill="#28a745" stroke="none" rx="5"/>
  <text x="960" y="861" font-family="Arial, sans-serif" font-size="51" font-weight="bold" text-anchor="middle" fill="white">閉じる</text>
</svg>
