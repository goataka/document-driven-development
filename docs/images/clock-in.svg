<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Modal Overlay -->
  <rect x="0" y="0" width="1200" height="800" fill="#000000" opacity="0.3"/>
  
  <!-- Modal Box -->
  <rect x="200" y="183" width="800" height="434" fill="white" stroke="#28a745" stroke-width="3" rx="10"/>
  
  <!-- Modal Title -->
  <text x="600" y="286" font-family="Arial, sans-serif" font-size="46" font-weight="bold" text-anchor="middle" fill="#28a745">出勤打刻完了</text>
  
  <!-- Success Icon -->
  <circle cx="600" cy="388" r="57" fill="#28a745" fill-opacity="0.2" stroke="#28a745" stroke-width="2"/>
  <text x="600" y="411" font-family="Arial, sans-serif" font-size="69" text-anchor="middle" fill="#28a745">✓</text>
  
  <!-- Message -->
  <text x="600" y="491" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#333">出勤時刻を記録しました</text>
  
  <!-- Time Display -->
  <text x="600" y="544" font-family="Arial, sans-serif" font-size="37" font-weight="bold" text-anchor="middle" fill="#28a745">09:00:00</text>
  
  <!-- Close Button -->
  <rect x="500" y="583" width="200" height="80" fill="#28a745" stroke="none" rx="5"/>
  <text x="600" y="638" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="white">閉じる</text>
</svg>
