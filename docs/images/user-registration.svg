<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f5f5f5"/>
  
  <!-- Registration Box -->
  <rect x="200" y="50" width="400" height="500" fill="white" stroke="#ddd" stroke-width="2" rx="10"/>
  
  <!-- Title -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">新規ユーザー登録</text>
  
  <!-- Name Label -->
  <text x="220" y="145" font-family="Arial, sans-serif" font-size="14" fill="#666">氏名</text>
  
  <!-- Name Input -->
  <rect x="220" y="155" width="360" height="35" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="230" y="177" font-family="Arial, sans-serif" font-size="14" fill="#999">山田 太郎</text>
  
  <!-- Email Label -->
  <text x="220" y="215" font-family="Arial, sans-serif" font-size="14" fill="#666">メールアドレス</text>
  
  <!-- Email Input -->
  <rect x="220" y="225" width="360" height="35" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="230" y="247" font-family="Arial, sans-serif" font-size="14" fill="#999">example@company.com</text>
  
  <!-- Password Label -->
  <text x="220" y="285" font-family="Arial, sans-serif" font-size="14" fill="#666">パスワード</text>
  
  <!-- Password Input -->
  <rect x="220" y="295" width="360" height="35" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="230" y="317" font-family="Arial, sans-serif" font-size="14" fill="#999">••••••••</text>
  
  <!-- Password Confirm Label -->
  <text x="220" y="355" font-family="Arial, sans-serif" font-size="14" fill="#666">パスワード（確認）</text>
  
  <!-- Password Confirm Input -->
  <rect x="220" y="365" width="360" height="35" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="230" y="387" font-family="Arial, sans-serif" font-size="14" fill="#999">••••••••</text>
  
  <!-- Company Code Label -->
  <text x="220" y="425" font-family="Arial, sans-serif" font-size="14" fill="#666">会社コード</text>
  
  <!-- Company Code Input -->
  <rect x="220" y="435" width="360" height="35" fill="white" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="230" y="457" font-family="Arial, sans-serif" font-size="14" fill="#999">ABC123</text>
  
  <!-- Register Button -->
  <rect x="220" y="490" width="360" height="40" fill="#007cc5" stroke="none" rx="5"/>
  <text x="400" y="517" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">登録</text>
  
  <!-- Login Link -->
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#666">すでにアカウントをお持ちの方は</text>
  <text x="400" y="570" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#007cc5" style="text-decoration: underline; cursor: pointer;">ログイン</text>
</svg>
