<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850">
  <!-- Background -->
  <rect width="800" height="850" fill="#f8f9fa"/>
  
  <!-- Top Bar -->
  <rect width="800" height="60" fill="#007cc5"/>
  <text x="20" y="38" font-size="20" font-weight="bold" fill="white">勤怠管理システム</text>
  <text x="720" y="38" font-size="16" fill="white">田中太郎 ▼</text>
  
  <!-- Page Title -->
  <text x="400" y="110" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">打刻履歴</text>
  
  <!-- Month Navigation -->
  <g>
    <rect x="250" y="140" width="300" height="40" fill="white" stroke="#007cc5" stroke-width="2" rx="5"/>
    <text x="400" y="165" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">2025年12月</text>
    <rect x="260" y="148" width="30" height="24" fill="#007cc5" rx="3" cursor="pointer"/>
    <text x="275" y="165" font-size="14" fill="white" text-anchor="middle">◀</text>
    <rect x="510" y="148" width="30" height="24" fill="#007cc5" rx="3" cursor="pointer"/>
    <text x="525" y="165" font-size="14" fill="white" text-anchor="middle">▶</text>
  </g>
  
  <!-- Table Header -->
  <rect x="50" y="220" width="700" height="40" fill="#007cc5"/>
  <text x="100" y="245" font-size="14" font-weight="bold" fill="white">日付</text>
  <text x="220" y="245" font-size="14" font-weight="bold" fill="white">曜日</text>
  <text x="320" y="245" font-size="14" font-weight="bold" fill="white">出勤</text>
  <text x="470" y="245" font-size="14" font-weight="bold" fill="white">退勤</text>
  <text x="620" y="245" font-size="14" font-weight="bold" fill="white">種別</text>
  
  <!-- Table Rows - Only days with records, separated by type -->
  <!-- Row 1: 12/1 - Attendance -->
  <rect x="50" y="260" width="700" height="50" fill="white" stroke="#ddd"/>
  <text x="100" y="290" font-size="14" fill="#333">2025/12/01</text>
  <text x="220" y="290" font-size="14" fill="#333">月</text>
  <text x="320" y="290" font-size="14" fill="#007cc5" font-weight="bold">09:00:00</text>
  <text x="470" y="290" font-size="14" fill="#666">-</text>
  <text x="620" y="290" font-size="14" fill="#007cc5">出勤</text>
  
  <!-- Row 2: 12/1 - Departure -->
  <rect x="50" y="310" width="700" height="50" fill="#f8f9fa" stroke="#ddd"/>
  <text x="100" y="340" font-size="14" fill="#333">2025/12/01</text>
  <text x="220" y="340" font-size="14" fill="#333">月</text>
  <text x="320" y="340" font-size="14" fill="#666">-</text>
  <text x="470" y="340" font-size="14" fill="#dc3545" font-weight="bold">18:00:00</text>
  <text x="620" y="340" font-size="14" fill="#dc3545">退勤</text>
  
  <!-- Row 3: 12/3 - Attendance -->
  <rect x="50" y="360" width="700" height="50" fill="white" stroke="#ddd"/>
  <text x="100" y="390" font-size="14" fill="#333">2025/12/03</text>
  <text x="220" y="390" font-size="14" fill="#333">水</text>
  <text x="320" y="390" font-size="14" fill="#007cc5" font-weight="bold">09:15:00</text>
  <text x="470" y="390" font-size="14" fill="#666">-</text>
  <text x="620" y="390" font-size="14" fill="#007cc5">出勤</text>
  
  <!-- Row 4: 12/3 - Departure -->
  <rect x="50" y="410" width="700" height="50" fill="#f8f9fa" stroke="#ddd"/>
  <text x="100" y="440" font-size="14" fill="#333">2025/12/03</text>
  <text x="220" y="440" font-size="14" fill="#333">水</text>
  <text x="320" y="440" font-size="14" fill="#666">-</text>
  <text x="470" y="440" font-size="14" fill="#dc3545" font-weight="bold">18:30:00</text>
  <text x="620" y="440" font-size="14" fill="#dc3545">退勤</text>
  
  <!-- Row 5: 12/4 - Attendance -->
  <rect x="50" y="460" width="700" height="50" fill="white" stroke="#ddd"/>
  <text x="100" y="490" font-size="14" fill="#333">2025/12/04</text>
  <text x="220" y="490" font-size="14" fill="#333">木</text>
  <text x="320" y="490" font-size="14" fill="#007cc5" font-weight="bold">09:00:00</text>
  <text x="470" y="490" font-size="14" fill="#666">-</text>
  <text x="620" y="490" font-size="14" fill="#007cc5">出勤</text>
  
  <!-- Row 6: 12/4 - Departure -->
  <rect x="50" y="510" width="700" height="50" fill="#f8f9fa" stroke="#ddd"/>
  <text x="100" y="540" font-size="14" fill="#333">2025/12/04</text>
  <text x="220" y="540" font-size="14" fill="#333">木</text>
  <text x="320" y="540" font-size="14" fill="#666">-</text>
  <text x="470" y="540" font-size="14" fill="#dc3545" font-weight="bold">18:45:00</text>
  <text x="620" y="540" font-size="14" fill="#dc3545">退勤</text>
  
  <!-- Row 7: 12/5 - Attendance -->
  <rect x="50" y="560" width="700" height="50" fill="white" stroke="#ddd"/>
  <text x="100" y="590" font-size="14" fill="#333">2025/12/05</text>
  <text x="220" y="590" font-size="14" fill="#333">金</text>
  <text x="320" y="590" font-size="14" fill="#007cc5" font-weight="bold">09:00:00</text>
  <text x="470" y="590" font-size="14" fill="#666">-</text>
  <text x="620" y="590" font-size="14" fill="#007cc5">出勤</text>
  
  <!-- Row 8: 12/5 - Departure -->
  <rect x="50" y="610" width="700" height="50" fill="#f8f9fa" stroke="#ddd"/>
  <text x="100" y="640" font-size="14" fill="#333">2025/12/05</text>
  <text x="220" y="640" font-size="14" fill="#333">金</text>
  <text x="320" y="640" font-size="14" fill="#666">-</text>
  <text x="470" y="640" font-size="14" fill="#dc3545" font-weight="bold">19:15:00</text>
  <text x="620" y="640" font-size="14" fill="#dc3545">退勤</text>
  
  <!-- Row 9: 12/6 - Attendance -->
  <rect x="50" y="660" width="700" height="50" fill="white" stroke="#ddd"/>
  <text x="100" y="690" font-size="14" fill="#333">2025/12/06</text>
  <text x="220" y="690" font-size="14" fill="#333">土</text>
  <text x="320" y="690" font-size="14" fill="#007cc5" font-weight="bold">10:00:00</text>
  <text x="470" y="690" font-size="14" fill="#666">-</text>
  <text x="620" y="690" font-size="14" fill="#007cc5">出勤</text>
  
  <!-- Row 10: 12/6 - Departure -->
  <rect x="50" y="710" width="700" height="50" fill="#f8f9fa" stroke="#ddd"/>
  <text x="100" y="740" font-size="14" fill="#333">2025/12/06</text>
  <text x="220" y="740" font-size="14" fill="#333">土</text>
  <text x="320" y="740" font-size="14" fill="#666">-</text>
  <text x="470" y="740" font-size="14" fill="#dc3545" font-weight="bold">15:00:00</text>
  <text x="620" y="740" font-size="14" fill="#dc3545">退勤</text>
  
  <!-- Pagination -->
  <g transform="translate(300, 780)">
    <rect x="0" y="0" width="80" height="35" fill="#007cc5" rx="5" cursor="pointer"/>
    <text x="40" y="22" font-size="14" fill="white" text-anchor="middle">前ページ</text>
    <text x="120" y="22" font-size="14" fill="#333" text-anchor="middle">ページ: 1/3</text>
    <rect x="160" y="0" width="80" height="35" fill="#007cc5" rx="5" cursor="pointer"/>
    <text x="200" y="22" font-size="14" fill="white" text-anchor="middle">次ページ</text>
  </g>
</svg>
