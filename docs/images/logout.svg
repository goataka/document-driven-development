<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="160" fill="#007cc5"/>
  <text x="48" y="106" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">勤怠管理システム</text>
  
  <!-- User Menu -->
  <rect x="840" y="40" width="312" height="80" fill="#005a8c" stroke="none" rx="5"/>
  <text x="876" y="96" font-family="Arial, sans-serif" font-size="35" fill="white">山田太郎 ▼</text>
  
  <!-- Dropdown Menu -->
  <rect x="840" y="133" width="312" height="427" fill="white" stroke="#ced4da" stroke-width="2" rx="5"/>
  
  <!-- Menu Items -->
  <rect x="840" y="133" width="312" height="106" fill="#f8f9fa" stroke-width="0" rx="5 5 0 0"/>
  <text x="876" y="200" font-family="Arial, sans-serif" font-size="32" fill="#495057">👤 プロフィール</text>
  
  <rect x="840" y="240" width="312" height="106" fill="white" stroke-width="0"/>
  <text x="876" y="306" font-family="Arial, sans-serif" font-size="32" fill="#495057">⚙️ 設定</text>
  
  <rect x="840" y="346" width="312" height="106" fill="white" stroke-width="0"/>
  <text x="876" y="413" font-family="Arial, sans-serif" font-size="32" fill="#495057">❓ ヘルプ</text>
  
  <rect x="840" y="453" width="312" height="106" fill="#fff3cd" stroke-width="0" rx="0 0 5 5"/>
  <text x="876" y="520" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#dc3545">🚪 ログアウト</text>
</svg>
