<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Login Box -->
  <rect x="375" y="150" width="450" height="420" fill="white" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Title -->
  <text x="600" y="225" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#333">勤怠管理システム</text>
  
  <!-- Email Label -->
  <text x="405" y="300" font-family="Arial, sans-serif" font-size="21" fill="#666">メールアドレス</text>
  
  <!-- Email Input -->
  <rect x="405" y="315" width="390" height="52" fill="white" stroke="#ced4da" stroke-width="1" rx="5"/>
  
  <!-- Password Label -->
  <text x="405" y="405" font-family="Arial, sans-serif" font-size="21" fill="#666">パスワード</text>
  
  <!-- Password Input -->
  <rect x="405" y="420" width="390" height="52" fill="white" stroke="#ced4da" stroke-width="1" rx="5"/>
  
  <!-- Login Button -->
  <rect x="405" y="502" width="390" height="60" fill="#007cc5" stroke="none" rx="5"/>
  <text x="600" y="543" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">ログイン</text>
  
  <!-- Registration Link (outside box) -->
  <text x="600" y="622" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#666">アカウントをお持ちでない方は</text>
  <text x="600" y="652" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#007cc5" style="text-decoration: underline; cursor: pointer;">新規登録</text>
</svg>
