  <text x="330" y="353" font-family="Arial, sans-serif" font-size="13" fill="#212529">2025/12/09</text>
  <text x="490" y="353" font-family="Arial, sans-serif" font-size="13" fill="#212529">09:15:00</text>
  <text x="650" y="353" font-family="Arial, sans-serif" font-size="13" fill="#212529">18:30:00</text>
  <text x="810" y="353" font-family="Arial, sans-serif" font-size="13" fill="#212529">9時間15分</text>
  <rect x="1000" y="335" width="140" height="25" fill="#6c757d" fill-opacity="0.2" stroke="#6c757d" stroke-width="1" rx="3"/>
  <text x="1070" y="353" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6c757d">退勤済み</text>
  
