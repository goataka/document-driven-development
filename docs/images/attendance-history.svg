  <text x="490" y="308" font-family="Arial, sans-serif" font-size="13" fill="#212529">09:00:00</text>
  <text x="650" y="308" font-family="Arial, sans-serif" font-size="13" fill="#6c757d">-</text>
  <text x="810" y="308" font-family="Arial, sans-serif" font-size="13" fill="#6c757d">-</text>
  <rect x="1000" y="290" width="140" height="25" fill="#28a745" fill-opacity="0.2" stroke="#28a745" stroke-width="1" rx="3"/>
  <text x="1070" y="308" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#28a745">勤務中</text>
  
  <!-- Row 2 -->
