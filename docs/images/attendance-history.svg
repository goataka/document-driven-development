  <rect x="290" y="370" width="880" height="45" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="330" y="398" font-family="Arial, sans-serif" font-size="13" fill="#212529">2025/12/06</text>
  <text x="490" y="398" font-family="Arial, sans-serif" font-size="13" fill="#212529">09:00:00</text>
  <text x="650" y="398" font-family="Arial, sans-serif" font-size="13" fill="#212529">18:00:00</text>
  <text x="810" y="398" font-family="Arial, sans-serif" font-size="13" fill="#212529">9時間00分</text>
  <rect x="1000" y="380" width="140" height="25" fill="#6c757d" fill-opacity="0.2" stroke="#6c757d" stroke-width="1" rx="3"/>
  <text x="1070" y="398" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6c757d">退勤済み</text>
  
  <!-- Row 4 -->
  <rect x="290" y="415" width="880" height="45" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="330" y="443" font-family="Arial, sans-serif" font-size="13" fill="#212529">2025/12/05</text>
  <text x="490" y="443" font-family="Arial, sans-serif" font-size="13" fill="#212529">08:55:00</text>
  <text x="650" y="443" font-family="Arial, sans-serif" font-size="13" fill="#212529">17:45:00</text>
  <text x="810" y="443" font-family="Arial, sans-serif" font-size="13" fill="#212529">8時間50分</text>
  <rect x="1000" y="425" width="140" height="25" fill="#6c757d" fill-opacity="0.2" stroke="#6c757d" stroke-width="1" rx="3"/>
  <text x="1070" y="443" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6c757d">退勤済み</text>
  
