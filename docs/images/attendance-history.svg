  <text x="330" y="488" font-family="Arial, sans-serif" font-size="13" fill="#212529">2025/12/04</text>
  <text x="490" y="488" font-family="Arial, sans-serif" font-size="13" fill="#212529">09:10:00</text>
  <text x="650" y="488" font-family="Arial, sans-serif" font-size="13" fill="#212529">18:20:00</text>
  <text x="810" y="488" font-family="Arial, sans-serif" font-size="13" fill="#212529">9時間10分</text>
  <rect x="1000" y="470" width="140" height="25" fill="#6c757d" fill-opacity="0.2" stroke="#6c757d" stroke-width="1" rx="3"/>
  <text x="1070" y="488" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6c757d">退勤済み</text>
  
  <!-- Row 6 -->
  <rect x="290" y="505" width="880" height="45" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="330" y="533" font-family="Arial, sans-serif" font-size="13" fill="#212529">2025/12/03</text>
  <text x="490" y="533" font-family="Arial, sans-serif" font-size="13" fill="#212529">09:00:00</text>
  <text x="650" y="533" font-family="Arial, sans-serif" font-size="13" fill="#212529">18:05:00</text>
  <text x="810" y="533" font-family="Arial, sans-serif" font-size="13" fill="#212529">9時間05分</text>
  <rect x="1000" y="515" width="140" height="25" fill="#6c757d" fill-opacity="0.2" stroke="#6c757d" stroke-width="1" rx="3"/>
  <text x="1070" y="533" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6c757d">退勤済み</text>
  
  <!-- Row 7 -->
  <rect x="290" y="550" width="880" height="45" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="330" y="578" font-family="Arial, sans-serif" font-size="13" fill="#212529">2025/12/02</text>
  <text x="490" y="578" font-family="Arial, sans-serif" font-size="13" fill="#212529">09:05:00</text>
  <text x="650" y="578" font-family="Arial, sans-serif" font-size="13" fill="#212529">18:00:00</text>
  <text x="810" y="578" font-family="Arial, sans-serif" font-size="13" fill="#212529">8時間55分</text>
  <rect x="1000" y="560" width="140" height="25" fill="#6c757d" fill-opacity="0.2" stroke="#6c757d" stroke-width="1" rx="3"/>
  <text x="1070" y="578" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6c757d">退勤済み</text>
  
  <!-- Summary Section -->
