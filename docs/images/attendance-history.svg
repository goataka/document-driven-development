  <text x="310" y="751" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#495057">合計勤務時間（12月）: 63時間15分</text>
  <text x="1000" y="751" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">ページ: 1/2</text>
