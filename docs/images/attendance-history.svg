<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#343a40"/>
  <text x="30" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">勤怠管理システム - 勤怠履歴</text>
  <text x="1050" y="50" font-family="Arial, sans-serif" font-size="14" fill="white">ユーザー名 ▼</text>
  
  <!-- Sidebar Menu -->
  <rect x="0" y="80" width="250" height="720" fill="#e9ecef" stroke="#dee2e6" stroke-width="1"/>
  <text x="20" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#495057">メニュー</text>
  
  <rect x="20" y="140" width="210" height="40" fill="#007bff" stroke="none" rx="5"/>
  <text x="35" y="166" font-family="Arial, sans-serif" font-size="14" fill="white">🏠 ダッシュボード</text>
  
  <rect x="20" y="190" width="210" height="40" fill="#6c757d" stroke="none" rx="5"/>
  <text x="35" y="216" font-family="Arial, sans-serif" font-size="14" fill="white">📋 勤怠履歴</text>
  
  <rect x="20" y="240" width="210" height="40" fill="#e9ecef" stroke="#ced4da" stroke-width="1" rx="5"/>
  <text x="35" y="266" font-family="Arial, sans-serif" font-size="14" fill="#495057">📊 月次レポート</text>
  
  <rect x="20" y="290" width="210" height="40" fill="#e9ecef" stroke="#ced4da" stroke-width="1" rx="5"/>
  <text x="35" y="316" font-family="Arial, sans-serif" font-size="14" fill="#495057">⚙️ 設定</text>
  
  <!-- Main Content Area -->
  <rect x="270" y="100" width="910" height="680" fill="white" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Title -->
  <text x="290" y="140" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">勤怠履歴</text>
  
  <!-- Date Filter -->
  <rect x="290" y="160" width="880" height="60" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="5"/>
  <text x="310" y="185" font-family="Arial, sans-serif" font-size="13" fill="#666">期間指定:</text>
  
  <!-- Start Date -->
  <text x="400" y="185" font-family="Arial, sans-serif" font-size="13" fill="#666">開始日</text>
  <rect x="400" y="190" width="150" height="25" fill="white" stroke="#ced4da" stroke-width="1" rx="3"/>
  <text x="410" y="208" font-family="Arial, sans-serif" font-size="12" fill="#495057">2025/12/01</text>
  
  <!-- End Date -->
  <text x="590" y="185" font-family="Arial, sans-serif" font-size="13" fill="#666">終了日</text>
  <rect x="590" y="190" width="150" height="25" fill="white" stroke="#ced4da" stroke-width="1" rx="3"/>
  <text x="600" y="208" font-family="Arial, sans-serif" font-size="12" fill="#495057">2025/12/10</text>
  
  <!-- Search Button -->
  <rect x="770" y="190" width="80" height="25" fill="#007bff" stroke="none" rx="3"/>
  <text x="810" y="208" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">検索</text>
  
  <!-- Export Button -->
  <rect x="1040" y="190" width="110" height="25" fill="#28a745" stroke="none" rx="3"/>
  <text x="1095" y="208" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">CSV出力</text>
  
  <!-- Table -->
  <rect x="290" y="240" width="880" height="520" fill="white" stroke="#dee2e6" stroke-width="1" rx="5"/>
  
  <!-- Table Header -->
  <rect x="290" y="240" width="880" height="40" fill="#343a40" stroke="none" rx="5 5 0 0"/>
  <text x="330" y="266" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">日付</text>
  <text x="490" y="266" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">出勤時刻</text>
  <text x="650" y="266" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">退勤時刻</text>
  <text x="810" y="266" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">勤務時間</text>
  <text x="1000" y="266" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">ステータス</text>
  
  <!-- Table Rows -->
  <!-- Row 1 -->
