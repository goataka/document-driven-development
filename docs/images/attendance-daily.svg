<svg width="1200" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="700" fill="#f8f9fa"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="80" fill="#007cc5"/>
  <text x="30" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">勤怠管理システム - 勤務実績（日次）</text>
  <text x="1050" y="50" font-family="Arial, sans-serif" font-size="14" fill="white">ユーザー名 ▼</text>
  
  <!-- Sidebar Menu -->
  <rect x="0" y="80" width="250" height="620" fill="#e9ecef" stroke="#dee2e6" stroke-width="1"/>
  <text x="20" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#495057">メニュー</text>
  
  <rect x="20" y="140" width="210" height="40" fill="#007cc5" stroke="none" rx="5"/>
  <text x="35" y="166" font-family="Arial, sans-serif" font-size="14" fill="white">🏠 ダッシュボード</text>
  
  <rect x="20" y="190" width="210" height="40" fill="#6c757d" stroke="none" rx="5"/>
  <text x="35" y="216" font-family="Arial, sans-serif" font-size="14" fill="white">📊 勤務実績</text>
  
  <rect x="20" y="240" width="210" height="40" fill="#e9ecef" stroke="#ced4da" stroke-width="1" rx="5"/>
  <text x="35" y="266" font-family="Arial, sans-serif" font-size="14" fill="#495057">⚙️ 設定</text>
  
  <!-- Main Content Area -->
  <rect x="270" y="100" width="910" height="580" fill="white" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Date Selector -->
  <rect x="605" y="118" width="40" height="30" fill="#007cc5" stroke="none" rx="3"/>
  <text x="625" y="139" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">◀</text>
  
  <rect x="655" y="118" width="180" height="30" fill="white" stroke="#ced4da" stroke-width="1" rx="3"/>
  <text x="745" y="139" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#495057">2025年12月8日（月）</text>
  
  <rect x="845" y="118" width="40" height="30" fill="#007cc5" stroke="none" rx="3"/>
  <text x="865" y="139" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">▶</text>
  
  <!-- Summary Card -->
  <rect x="290" y="170" width="880" height="500" fill="white" stroke="#dee2e6" stroke-width="2" rx="10"/>
  
  <!-- Status (below date) -->
  <rect x="605" y="160" width="280" height="40" fill="#6c757d" fill-opacity="0.1" stroke="#6c757d" stroke-width="2" rx="8"/>
  <text x="745" y="185" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#6c757d">ステータス: 退勤済み</text>
  
  <!-- Content Area -->
  <g transform="translate(0, 0)">
    <!-- Clock-in Time -->
    <rect x="350" y="220" width="250" height="80" fill="#f8f9fa" stroke="#007cc5" stroke-width="2" rx="8"/>
    <text x="475" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">出勤時刻</text>
    <text x="475" y="280" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#007cc5">09:00</text>
    
    <!-- Clock-out Time -->
    <rect x="650" y="220" width="250" height="80" fill="#f8f9fa" stroke="#dc3545" stroke-width="2" rx="8"/>
    <text x="775" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">退勤時刻</text>
    <text x="775" y="280" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#dc3545">18:00</text>
    
    <!-- Work Hours -->
    <rect x="350" y="320" width="250" height="80" fill="#f8f9fa" stroke="#28a745" stroke-width="2" rx="8"/>
    <text x="475" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">勤務時間</text>
    <text x="475" y="380" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#28a745">9時間00分</text>
    
    <!-- Overtime Hours -->
    <rect x="650" y="320" width="250" height="80" fill="#f8f9fa" stroke="#dc3545" stroke-width="2" rx="8"/>
    <text x="775" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">残業時間</text>
    <text x="775" y="380" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#dc3545">1時間00分</text>
    
    <!-- Note (to the right of overtime) -->
    <text x="925" y="345" font-family="Arial, sans-serif" font-size="12" fill="#666">※所定労働時間: 8時間</text>
    <text x="925" y="365" font-family="Arial, sans-serif" font-size="12" fill="#666">※残業時間 = 勤務時間</text>
    <text x="925" y="380" font-family="Arial, sans-serif" font-size="12" fill="#666">　　　　　 - 所定労働時間</text>
    
    <!-- Time Entry List -->
    <rect x="310" y="420" width="840" height="230" fill="white" stroke="#dee2e6" stroke-width="1" rx="5"/>
    
    <!-- Table Header -->
    <rect x="310" y="420" width="840" height="35" fill="#007cc5" stroke="none" rx="5"/>
    <rect x="310" y="420" width="840" height="5" fill="#007cc5" stroke="none"/>
    <text x="350" y="443" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">時刻</text>
    <text x="500" y="443" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">区分</text>
    <text x="700" y="443" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">備考</text>
    
    <!-- Entry 1: Clock-in -->
    <rect x="310" y="455" width="840" height="35" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
    <text x="350" y="478" font-family="Arial, sans-serif" font-size="12" fill="#212529">09:00:00</text>
    <text x="500" y="478" font-family="Arial, sans-serif" font-size="12" fill="#007cc5" font-weight="bold">出勤</text>
    <text x="700" y="478" font-family="Arial, sans-serif" font-size="12" fill="#495057">通常勤務</text>
    
    <!-- Entry 2: Clock-out -->
    <rect x="310" y="490" width="840" height="35" fill="white" stroke="#dee2e6" stroke-width="1"/>
    <text x="350" y="513" font-family="Arial, sans-serif" font-size="12" fill="#212529">18:00:00</text>
    <text x="500" y="513" font-family="Arial, sans-serif" font-size="12" fill="#dc3545" font-weight="bold">退勤</text>
    <text x="700" y="513" font-family="Arial, sans-serif" font-size="12" fill="#495057">通常退勤</text>
  </g>
</svg>
