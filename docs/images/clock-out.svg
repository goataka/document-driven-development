<svg width="600" height="380" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="380" fill="#f8f9fa"/>
  
  <!-- Modal Overlay -->
  <rect x="0" y="0" width="600" height="380" fill="#000000" opacity="0.3"/>
  
  <!-- Modal Box -->
  <rect x="100" y="60" width="400" height="260" fill="white" stroke="#dc3545" stroke-width="3" rx="10"/>
  
  <!-- Modal Title -->
  <text x="300" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#dc3545">退勤打刻完了</text>
  
  <!-- Success Icon -->
  <circle cx="300" cy="145" r="25" fill="#dc3545" fill-opacity="0.2" stroke="#dc3545" stroke-width="2"/>
  <text x="300" y="155" font-family="Arial, sans-serif" font-size="30" text-anchor="middle" fill="#dc3545">✓</text>
  
  <!-- Message -->
  <text x="300" y="190" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">退勤時刻を記録しました</text>
  
  <!-- Work Summary -->
  <rect x="130" y="205" width="340" height="75" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="5"/>
  <text x="150" y="227" font-family="Arial, sans-serif" font-size="12" fill="#666">出勤: 09:00</text>
  <text x="150" y="247" font-family="Arial, sans-serif" font-size="12" fill="#666">退勤: 18:00</text>
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745">勤務時間: 9時間00分</text>
  
  <!-- Close Button -->
  <rect x="250" y="295" width="100" height="35" fill="#dc3545" stroke="none" rx="5"/>
  <text x="300" y="319" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">閉じる</text>
</svg>
