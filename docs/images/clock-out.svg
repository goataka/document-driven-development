<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Modal Overlay -->
  <rect x="0" y="0" width="1200" height="800" fill="#000000" opacity="0.3"/>
  
  <!-- Modal Box -->
  <rect x="200" y="183" width="800" height="549" fill="white" stroke="#dc3545" stroke-width="3" rx="10"/>
  
  <!-- Modal Title -->
  <text x="600" y="286" font-family="Arial, sans-serif" font-size="46" font-weight="bold" text-anchor="middle" fill="#dc3545">退勤打刻完了</text>
  
  <!-- Success Icon -->
  <circle cx="600" cy="388" r="57" fill="#dc3545" fill-opacity="0.2" stroke="#dc3545" stroke-width="2"/>
  <text x="600" y="411" font-family="Arial, sans-serif" font-size="69" text-anchor="middle" fill="#dc3545">✓</text>
  
  <!-- Message -->
  <text x="600" y="491" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#333">退勤時刻を記録しました</text>
  
  <!-- Clock-out Time Display -->
  <text x="600" y="544" font-family="Arial, sans-serif" font-size="37" font-weight="bold" text-anchor="middle" fill="#dc3545">18:00:00</text>
  
  <!-- Work Hours Display -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#28a745">勤務時間: 9時間00分</text>
  
  <!-- Close Button -->
  <rect x="500" y="628" width="200" height="80" fill="#dc3545" stroke="none" rx="5"/>
  <text x="600" y="683" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="white">閉じる</text>
</svg>
