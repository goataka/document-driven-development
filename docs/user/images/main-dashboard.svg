<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#f8f9fa"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1920" height="108" fill="#007cc5"/>
  <text x="48" y="68" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="white">勤怠管理システム</text>
  <text x="1680" y="68" font-family="Arial, sans-serif" font-size="22" fill="white">ユーザー名 ▼</text>
  
  <!-- Clock In/Out Buttons -->
  <g>
    <!-- Clock In Button -->
    <rect x="80" y="162" width="320" height="135" fill="#28a745" stroke="none" rx="10"/>
    <text x="240" y="230" font-family="Arial, sans-serif" font-size="38" font-weight="bold" text-anchor="middle" fill="white">出勤</text>
    <text x="240" y="263" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="white">クリックして出勤打刻</text>
    
    <!-- Clock Out Button -->
    <rect x="448" y="162" width="320" height="135" fill="#dc3545" stroke="none" rx="10"/>
    <text x="608" y="230" font-family="Arial, sans-serif" font-size="38" font-weight="bold" text-anchor="middle" fill="white">退勤</text>
    <text x="608" y="263" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="white">クリックして退勤打刻</text>
  </g>
  
  <!-- Current Status Panel -->
  <rect x="80" y="338" width="688" height="202" fill="white" stroke="#dee2e6" stroke-width="2" rx="10"/>
  <text x="112" y="385" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#333">本日の勤務状況</text>
  
  <!-- Status Info -->
  <text x="112" y="432" font-family="Arial, sans-serif" font-size="22" fill="#666">日付: 2025年12月10日</text>
  <text x="112" y="466" font-family="Arial, sans-serif" font-size="22" fill="#666">出勤時刻: 09:00</text>
  <text x="112" y="500" font-family="Arial, sans-serif" font-size="22" fill="#666">状態: 勤務中</text>
  
  <!-- Quick Access Menu -->
  <rect x="832" y="162" width="1008" height="378" fill="white" stroke="#dee2e6" stroke-width="2" rx="10"/>
  <text x="864" y="209" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#333">クイックアクセス</text>
  
  <!-- Menu Items -->
  <rect x="864" y="243" width="448" height="81" fill="#e9ecef" stroke="#ced4da" stroke-width="1" rx="5"/>
  <text x="896" y="293" font-family="Arial, sans-serif" font-size="26" fill="#333">📋 勤怠履歴を見る</text>
  
  <rect x="1360" y="243" width="448" height="81" fill="#e9ecef" stroke="#ced4da" stroke-width="1" rx="5"/>
  <text x="1392" y="293" font-family="Arial, sans-serif" font-size="26" fill="#333">⚙️ 設定</text>
  
  <rect x="864" y="351" width="448" height="81" fill="#e9ecef" stroke="#ced4da" stroke-width="1" rx="5"/>
  <text x="896" y="401" font-family="Arial, sans-serif" font-size="26" fill="#333">❓ ヘルプ</text>
  
  <!-- Recent Activity -->
  <rect x="80" y="662" width="1760" height="370" fill="white" stroke="#dee2e6" stroke-width="2" rx="10"/>
  <text x="112" y="716" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#333">最近の勤怠記録</text>
  
  <!-- Table Header -->
  <rect x="112" y="740" width="1696" height="54" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="144" y="775" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#495057">日付</text>
  <text x="448" y="775" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#495057">出勤</text>
  <text x="752" y="775" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#495057">退勤</text>
  <text x="1056" y="775" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#495057">勤務時間</text>
  <text x="1360" y="775" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#495057">ステータス</text>
  
  <!-- Table Rows -->
  <rect x="112" y="794" width="1696" height="54" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="144" y="829" font-family="Arial, sans-serif" font-size="21" fill="#212529">2025/12/10</text>
  <text x="448" y="829" font-family="Arial, sans-serif" font-size="21" fill="#212529">09:00</text>
  <text x="752" y="829" font-family="Arial, sans-serif" font-size="21" fill="#212529">-</text>
  <text x="1056" y="829" font-family="Arial, sans-serif" font-size="21" fill="#212529">-</text>
  <text x="1360" y="829" font-family="Arial, sans-serif" font-size="21" fill="#28a745">勤務中</text>
  
  <rect x="112" y="848" width="1696" height="54" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="144" y="883" font-family="Arial, sans-serif" font-size="21" fill="#212529">2025/12/09</text>
  <text x="448" y="883" font-family="Arial, sans-serif" font-size="21" fill="#212529">09:15</text>
  <text x="752" y="883" font-family="Arial, sans-serif" font-size="21" fill="#212529">18:30</text>
  <text x="1056" y="883" font-family="Arial, sans-serif" font-size="21" fill="#212529">9:15</text>
  <text x="1360" y="883" font-family="Arial, sans-serif" font-size="21" fill="#6c757d">退勤済み</text>
  
  <rect x="112" y="902" width="1696" height="54" fill="white" stroke="#dee2e6" stroke-width="1"/>
  <text x="144" y="937" font-family="Arial, sans-serif" font-size="21" fill="#212529">2025/12/06</text>
  <text x="448" y="937" font-family="Arial, sans-serif" font-size="21" fill="#212529">09:00</text>
  <text x="752" y="937" font-family="Arial, sans-serif" font-size="21" fill="#212529">18:00</text>
  <text x="1056" y="937" font-family="Arial, sans-serif" font-size="21" fill="#212529">9:00</text>
  <text x="1360" y="937" font-family="Arial, sans-serif" font-size="21" fill="#6c757d">退勤済み</text>
</svg>
